name: CD - Build and Push Docker Image

on:
  push:
    branches: [ "gamelift-backend-staging" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push.
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: qarani/gamelift-backend:staging
        build-args: |
          APP_ENV=staging

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - name: Install Tailscale
      run: |
        curl -fsSL https://tailscale.com/install.sh | sh
        sudo tailscale up --authkey ${{ secrets.TAILSCALE_AUTH_KEY }}

    - name: Deploy to Staging via SSH over Tailscale.
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.STAGING_HOST }}
        username: ${{ secrets.STAGING_USERNAME }}
        key: ${{ secrets.STAGING_SSH_KEY }}
        script: |
          docker pull qarani/gamelift-backend:staging
          docker stop gamelift-backend || true
          docker rm gamelift-backend || true
          docker run -d --name gamelift-backend --network aws-staging-network \
            -p 8080:8080 \
            -e APP_ENV=staging \
            -e SERVER_PORT=:8091 \
            -e PUBLIC_URL=http://localhost:8071 \
            -e DEBUG_MODE=false \
            -e GODOT_PATH=/usr/local/bin/godot \
            -e JWT_EXPIRATION_MS=86400000 \
            -e DB_HOST=postgres-staging \
            -e DB_PORT=5432 \
            -e DB_USER=postgres-staging-user \
            -e DB_PASSWORD=postgres-staging-password \
            -e DB_NAME=gamelift_db \
            -e NATS_URL=nats://nats-staging:4222 \
            -e NATS_USER=nats-staging-user \
            -e NATS_PASSWORD=nats-staging-password \
            -e EUREKA_SERVER_URL=http://discovery-server-staging:8761/eureka \
            -e EUREKA_APP_NAME=gamelift-server \
            -e EUREKA_HOSTNAME=discovery-server-staging \
            -e EUREKA_IP_ADDR=discovery-server-staging \
            -e EUREKA_VIP_ADDRESS=gamelift-server \
            -e EUREKA_INSTANCE_ID=gamelift-server \
            -e SERVICE_PORT=8080 \
            -e S3_ENDPOINT=minio-staging:9000 \
            -e S3_ACCESS_KEY=minio-staging-user \
            -e S3_SECRET_KEY=minio-staging-password \
            -e S3_USE_SSL=false \
            -e SQLITE_PATH=gamelift_fallback.db \
            qarani/gamelift-backend:staging
