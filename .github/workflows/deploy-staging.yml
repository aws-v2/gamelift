name: Staging Deployment

on:
  push:
    branches: [ "staging" ]
  pull_request:
    branches: [ "staging" ]

jobs:
  staging-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Install libvirt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvirt-dev \
            libvirt-daemon \
            pkg-config
      - name: Download dependencies
        run: go mod download
      - name: Build
        run: go build ./...
      - name: Run tests
        run: go test ./... -v

  staging-build-image:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: staging-test
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: qarani/gamelift-backend:staging

  staging-deploy:
    needs: staging-build-image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: Install Tailscale
      run: |
        curl -fsSL https://tailscale.com/install.sh | sh
        sudo tailscale up --authkey ${{ secrets.TAILSCALE_AUTH_KEY }}

    - name: Deploy to Staging via SSH over Tailscale.
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.STAGING_HOST }}
        username: ${{ secrets.STAGING_USERNAME }}
        key: ${{ secrets.STAGING_SSH_KEY }}
        script: |
          docker pull qarani/gamelift-backend:staging
          docker stop gamelift-backend || true
          docker rm gamelift-backend || true
          docker run -d --name gamelift-backend --network aws-staging-network \
            -p 8091:8091 \
            -e APP_ENV=staging \
            -e SERVER_PORT=:8091 \
            -e DEBUG_MODE=false \
            -e GODOT_PATH=/usr/local/bin/godot \
            -e JWT_EXPIRATION_MS=86400000 \
            -e DB_HOST=postgres-staging \
            -e DB_PORT=5432 \
            -e DB_USER=postgres-staging-user \
            -e DB_PASSWORD=postgres-staging-password \
            -e DB_NAME=gamelift_db \
            -e NATS_URL=nats://nats-staging:4222 \
            -e NATS_USER=nats-staging-user \
            -e NATS_PASSWORD=nats-staging-password \
            -e NATS_PREFIX=staging.v1 \
            -e EUREKA_SERVER_URL=http://discovery-server-staging:8761/eureka \
            -e EUREKA_APP_NAME=GAMELIFT-SERVER \
            -e EUREKA_HOSTNAME=gamelift-backend \
            -e EUREKA_IP_ADDR=gamelift-backend \
            -e EUREKA_VIP_ADDRESS=gamelift-server \
            -e EUREKA_INSTANCE_ID=gamelift-server:8091 \
            -e EUREKA_HEARTBEAT_INTERVAL=30s \
            -e S3_ENDPOINT=minio-staging:9000 \
            -e S3_ACCESS_KEY=minio-staging-user \
            -e S3_SECRET_KEY=minio-staging-password \
            -e S3_USE_SSL=false \
            -e SQLITE_PATH=gamelift_fallback.db \
            qarani/gamelift-backend:staging

  staging-open-pr-to-main:
    needs: staging-deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch target branches
        run: |
          git fetch origin gamelift-backend-main gamelift-backend-staging
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

      - name: Create PR staging → main
        run: |
          if gh pr list --base gamelift-backend-main --head gamelift-backend-staging --state open --json number | jq -e 'length > 0' > /dev/null; then
            echo "PR already exists. Skipping..."
          else
            gh pr create \
              --base gamelift-backend-main \
              --head gamelift-backend-staging \
              --title "chore: promote staging → main" \
              --body "✅ Staging deployment succeeded. Auto-generated PR for production release."
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}