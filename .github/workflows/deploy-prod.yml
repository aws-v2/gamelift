name: Prod Deployment

on:
  push:
    branches: ["gamelift-backend-main"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: qarani/metrics-server:prod

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Deploy to Prod via SSH over Tailscale
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            docker network create aws-prod-network || true
            docker pull qarani/metrics-server:prod
            docker stop metrics-server-prod || true
            docker rm metrics-server-prod || true
            docker run -d \
              --name metrics-server-prod \
              --network aws-prod-network \
              -p 8091:8091 \
              -e APP_ENV=prod \
              -e SERVER_PORT=:8091 \
              -e DEBUG_MODE=false \
              -e GODOT_PATH=/usr/local/bin/godot \
              -e JWT_EXPIRATION_MS=86400000 \
              -e DB_HOST=postgres-prod \
              -e DB_PORT=5432 \
              -e DB_USER=postgres-prod-user \
              -e DB_PASSWORD=postgres-prod-password \
              -e DB_NAME=gamelift_db \
              -e NATS_URL=nats://nats-prod:4222 \
              -e NATS_USER=nats-prod-user \
              -e NATS_PASSWORD=nats-prod-password \
              -e EUREKA_SERVER_URL=http://discovery-server-prod:8761/eureka \
              -e EUREKA_APP_NAME=GAMELIFT-SERVER \
              -e EUREKA_HOSTNAME=gamelift-backend \
              -e EUREKA_IP_ADDR=gamelift-backend \
              -e EUREKA_VIP_ADDRESS=gamelift-server \
              -e EUREKA_INSTANCE_ID=gamelift-server:8091 \
              -e EUREKA_HEARTBEAT_INTERVAL=30s \
              -e S3_ENDPOINT=minio-prod:9000 \
              -e S3_ACCESS_KEY=minio-prod-user \
              -e S3_SECRET_KEY=minio-prod-password \
              -e S3_USE_SSL=false \
              -e SQLITE_PATH=gamelift_fallback.db \
              qarani/metrics-server:prod




