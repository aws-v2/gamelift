name: Prod deployment Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  prod-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Install libvirt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvirt-dev \
            libvirt-daemon \
            pkg-config
      - name: Download dependencies
        run: go mod download
      - name: Build
        run: go build ./...
      - name: Run tests
        run: go test ./... -v

  prod-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: prod-test
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: qarani/gamelift-backend:prod

  prod-deploy:
    needs: prod-build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Deploy to Prod via SSH over Tailscale
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            docker network create aws-prod-network || true
            docker pull qarani/gamelift-backend:prod
            docker stop gamelift-backend-prod || true
            docker service rm gamelift-backend-prod || true

            docker service create \
              --name gamelift-backend-prod \
              --network aws-prod-network \
              --publish published=8091,target=8091 \
              --env APP_ENV=prod \
              --env SERVER_PORT=:8091 \
              --env DEBUG_MODE=false \
              --env GODOT_PATH=/usr/local/bin/godot \
              --env JWT_EXPIRATION_MS=86400000 \
              --env DB_HOST=postgres-prod \
              --env DB_PORT=5432 \
              --env DB_USER=postgres-prod-user \
              --env DB_PASSWORD=postgres-prod-password \
              --env DB_NAME=gamelift_db \
              --env NATS_URL=nats://nats-prod:4222 \
              --env NATS_USER=nats-prod-user \
              --env NATS_PASSWORD=nats-prod-password \
              --env EUREKA_SERVER_URL=http://discovery-server-prod:8761/eureka \
              --env EUREKA_APP_NAME=GAMELIFT-SERVER \
              --env EUREKA_HOSTNAME=gamelift-backend \
              --env EUREKA_IP_ADDR=gamelift-backend \
              --env EUREKA_VIP_ADDRESS=gamelift-server \
              --env EUREKA_INSTANCE_ID=gamelift-server:8091 \
              --env EUREKA_HEARTBEAT_INTERVAL=30s \
              --env S3_ENDPOINT=minio-prod:9000 \
              --env S3_ACCESS_KEY=minio-prod-user \
              --env S3_SECRET_KEY=minio-prod-password \
              --env S3_USE_SSL=false \
              --env SQLITE_PATH=gamelift_fallback.db \
              qarani/gamelift-backend:prod



